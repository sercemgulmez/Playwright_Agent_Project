              - button "Taahhütsayar sana ne sağlar?" [ref=e160] [cursor=pointer]:
                - generic [ref=e162]: Taahhütsayar sana ne sağlar?
                - img [ref=e164]
              - heading [level=3] [ref=e167]: TaahhütSayar, taahhüdünün bitmesine yakın sana ulaşarak özel bir fırsat sunmamızı ve Turknet’in avantajlı dünyasına daha da ayrıcalıklı şekilde adım atmanı sağlar. Bunun sonucunda ise, taahhütlü internet kullanımından seni kurtarmamıza ve tek fiyat ödeyerek interneti 1.000 Mbps’ye varan eşit/simetrik download (indirme) & upload (yükleme) hızda kullanmana yardımcı olur. Düşük ping ve kotasız kullanımı da unutmamak gerek.
            - separator [ref=e168]
            - generic [ref=e169]:
              - button "Taahhütsayar nasıl işler?" [ref=e170] [cursor=pointer]:
                - generic [ref=e172]: Taahhütsayar nasıl işler?
                - img [ref=e174]
              - heading [level=3] [ref=e177]: Turknet’in TaahhütSayar kolaylığından yararlanman için tek yapman gereken; taahhüt bildirme formunu doldurarak, mevcut operatöründeki taahhüt bitiş tarihini bizimle paylaşman. Sonrasında, sana belli aralıklarla taahhüdünün bitmesine ne kadar kaldığına dair hatırlatma yapacağız ve sana özel fırsatlar sunarak Turknet’in özgür, yani taahhütsüz internet hizmetiyle tanışmanı daha da avantajlı hale getireceğiz. Yerleşik operatördeysen, senin adına tüm işlemleri yürüteceğiz ve internet hizmetinin kesintisiz şekilde Turknet’e taşınmasını sağlayacağız. Altyapının GigaFiber’e uygun olması halinde ise önce mevcut operatöründen aldığın hizmeti sonlandırabilir, sonrasında birkaç tıklamayla Turknet’e tamamen dijital olarak geçiş yapabilirsin.
            - separator [ref=e178]
            - generic [ref=e179]:
              - button "Turknet’e nasıl geçilir?" [ref=e180] [cursor=pointer]:
                - generic [ref=e182]: Turknet’e nasıl geçilir?
                - img [ref=e184]
              - heading [level=3] [ref=e187]: 1.000 Mbps hız, Turknet'in kendi altyapısı olan GigaFiber bölgelerinde mümkündür. Adresiniz GigaFiber'i destekliyorsa, bu hıza kadar hizmet alabilirsiniz.
            - separator [ref=e188]
            - generic [ref=e189]:
              - button "1.000 Mbps’ye kadar hız nasıl oluyor?" [ref=e190] [cursor=pointer]:
                - generic [ref=e192]: 1.000 Mbps’ye kadar hız nasıl oluyor?
                - img [ref=e194]
              - heading [level=3] [ref=e197]: Biz denedik, inan çok güzel oluyor :) Turknet olarak, altyapının desteklediği en yüksek hızı sana sunuyor, herhangi bir sınırlamaya gitmiyoruz. Eğer altyapın 1.000 Mbps’ye kadar hızı destekliyorsa, bu hızı aynen evine getiriyoruz. Yani, ne kadar hız alacağını adresindeki altyapı belirliyor. Üstelik simetrik olarak sunduğumuz internet hizmetimiz sayesinde seni eşit download (indirme) ve upload (yükleme) hızıyla buluşturuyoruz.
            - separator [ref=e198]
            - generic [ref=e199]:
              - button "Cayma bedelini diğer operatörler nasıl hesaplıyor?" [ref=e200] [cursor=pointer]:
                - generic [ref=e202]: Cayma bedelini diğer operatörler nasıl hesaplıyor?
                - img [ref=e204]
              - heading [level=3] [ref=e207]: Örneğin liste fiyatı 300 TL olan bir paketten 140 TL’ye iki yıl taahhüt vererek internet hizmeti aldığını ve memnun kalmadığın için beşinci ayda bu hizmeti sonlandırdığını düşünelim. Bu durumda, sana aylık sağlanan 140 TL indirim; kullanım yaptığın ay sayısıyla, yani beşle çarpılır. Bu bedele, başta sana hediye olduğu söylenen aktivasyon ücreti ve bunun gibi bazı ek bedeller de eklenebilir. Ayrıca modem aldıysan, muhtemelen onun da güncel liste fiyatı, cayma bedeline eklenir.
            - separator [ref=e208]
            - generic [ref=e209]:
              - button "Telefon numaram size mi taşınacak?" [ref=e210] [cursor=pointer]:
                - generic [ref=e212]: Telefon numaram size mi taşınacak?
                - img [ref=e214]
              - heading [level=3] [ref=e217]: Evet, mevcut operatöründe telefon numarası kullanıyorsan, aynı telefon numarasını kullanmaya devam edeceksiniz. Bazı operatörler fiber hizmet verdikleri yerlerde VOIP teknolojisi üzerinden telefon hizmeti veriyorlar. Böyle bir hizmet kullanıyorsan, telefon numaranı Turknet’e taşıyamayabiliriz, o zaman sana yeni bir numara tahsis ederiz.
            - separator [ref=e218]
            - generic [ref=e219]:
              - button "Memnun kalmazsam ne olacak?" [ref=e220] [cursor=pointer]:
                - generic [ref=e222]: Memnun kalmazsam ne olacak?
                - img [ref=e224]
              - heading [level=3] [ref=e227]: Hiçbir şey. Hizmetimizden memnun kalmazsan, bir ay içinde vazgeçerek ödediğin ücreti geri alabilirsin. Böylece cebinden hiçbir ücret ödemeden Turknet’i denemiş olursun. Ayrıca, taahhütsüz bir hizmet sunduğumuz için dilediğin zaman, aldığın hizmeti herhangi bir sebeple sonlandırabilirsin.
            - separator [ref=e228]
