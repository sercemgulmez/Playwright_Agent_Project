        - generic [ref=e197]:
          - generic [ref=e198]:
            - heading "Soru/Cevap" [level=2] [ref=e199]
            - paragraph [ref=e200]: Aklınıza takılan bir soru mu var?
          - generic [ref=e201]:
            - generic [ref=e202]:
              - button "ADSL, VDSL ve Fiber Altyapıların Farkları Nelerdir?" [ref=e203] [cursor=pointer]:
                - generic [ref=e205]: ADSL, VDSL ve Fiber Altyapıların Farkları Nelerdir?
                - img [ref=e207]
              - heading [level=3] [ref=e210]:
                - generic [ref=e211]:
                  - paragraph [ref=e212]: ADSL, VDSL ve fiber internet altyapılarının kullanıcı odağındaki farkı indirme ve yükleme hızıdır. Yani altyapınızın teknolojisini tanımlar.
                  - paragraph [ref=e213]: ADSL (Asymmetric Digital Subscriber Line), bir çeşit DSL bağlantısıdır. Bu teknolojideki internet bağlantısı standart bakır telefon kabloların kullanılmasıyla sağlanır. Veri, ses trafiğinin kullanmadığı frekanslar üzerinden gönderilir. Bu teknolojinin avantajı, mevcut telefon altyapısının kullanılması ve yeni altyapı yatırımı yapılmasına ihtiyaç duyulmamasıdır.
                  - paragraph [ref=e214]: ADSL teorik olarak 24 Mbps’ye kadar indirme (download) hızı verilebilir ancak yükleme (upload) hızı çok daha sınırlıdır. Alınabilecek maksimum hız; internet altyapısına ve ev içi tesisatın kalitesine, santrale olan uzaklığa ve hat gürültü oranına göre değişkenlik gösterir. ADSL2+ teknolojisi ise daha yeni bir DSL teknolojisidir. Santrale iki kilometre mesafede olan bölgelerde daha yüksek internet hızları alınmasına olanak sağlar.
                  - paragraph [ref=e215]: VDSL (Very-high-bitrate Digital Subscriber Line), ADSL’den çok daha yüksek hızlara (5 kat daha fazla download ve 10 kat daha fazla upload hızı) olanak verir. Sinyalin güçlü olarak aktarılabildiği noktalarda 100 Mbps’ye kadar hıza ulaşılabilir. VDSL teknolojisi bakır telefon hatlarını çok daha verimli şekilde kullanır. Ancak bu verim ADSL’e kıyasla çok daha kısa mesafelerde mümkündür. Kısa mesafeler, daha az bozulma ve daha çok güvenilir bağlantı demektir. Ayrıca, internet altyapısının ve iç tesisatın kalitesi de VDSL verimliliğini etkiler.
                  - paragraph [ref=e216]: Fiber internet teknolojisi ise ADSL ve VDSL teknolojilerine göre teoride daha yüksek hız sunar. Bunun sebebi, mesafeye bağlı hız kaybı yaşanmamasıdır. Ancak bu teknolojide de yoğun kullanım saatlerinde alınabilecek maksimum hızlar düşebilmektedir. Aslında 75 Mbps VDSL hizmeti, operatörlerin sunduğu 20 Mbps fiber hizmetinden dosya indirme olarak daha hızlıdır. Ancak tabii ki; kullanım yoğunluğu, hat kalitesi, modem ayarları, santrale olan yakınlık unsurları, hızı etkileyen başlıca faktörlerdir.
                  - paragraph [ref=e217]: Biz de kullanıcılarımız için her geçen gün fiber altyapı çalışmalarımızı artırıyoruz. Tamamen kendi internet altyapımızda kullandığımız fiber optik kablolar sayesinde binana ya da dairene kadar gelip ev internetinin dünya standartlarına çıkmasını sağlıyoruz. Hem indirme (download) hem de yükleme (upload) hızlarımızla, tat kaçıran bekleme sürelerini, düşük çözünürlükle izlenen filmleri ve dizileri geçmişte bırakıyoruz. Dosyalarını hızla indirmeni, paylaşmanı ve zamandan tasarruf etmeni sağlıyoruz.
            - separator [ref=e218]
            - generic [ref=e219]:
              - button "Gerçekten Taahhüt Yok mu? Peki, Fiyatlar Ne Sıklıkla Değişiyor?" [ref=e220] [cursor=pointer]:
                - generic [ref=e222]: Gerçekten Taahhüt Yok mu? Peki, Fiyatlar Ne Sıklıkla Değişiyor?
                - img [ref=e224]
              - heading [level=3] [ref=e227]:
                - paragraph [ref=e229]: Evet, Turknet’te kesinlikle ve kesinlikle taahhüt yok. Yani Turknet’te interneti sadece memnun olduğun sürece kullanır, dilediğin zaman herhangi bir taahhüt cayma bedeli ödemene gerek kalmadan abonelik hizmetini sonlandırabilirsin. Fiyat güncellemelerini piyasa koşullarına bağlı olarak gerçekleştiriyoruz ama bu güncellemeyi de sürekli yapmıyoruz. Yani Turknet’te fiyat güncellemesi yılda defalarca tekrar eden bir durum değil. Genellikle yılda 1 kere fiyat güncellemesi yapıyoruz gibi düşünebilirsin.
            - separator [ref=e230]
            - generic [ref=e231]:
              - button "Aldığım Hız Düşer mi? Dediğiniz Hızı Gerçekten Alır mıyım?" [ref=e232] [cursor=pointer]:
                - generic [ref=e234]: Aldığım Hız Düşer mi? Dediğiniz Hızı Gerçekten Alır mıyım?
                - img [ref=e236]
              - heading [level=3] [ref=e239]:
                - paragraph [ref=e241]: "Altyapına göre Turknet’te sana hep hızlı bağlantı sunuyoruz. Hız durumu; modem kalitesi ve ev içi bağlantı durumu, duvar kalınlığı ve benzeri diğer şartlara göre değişkenlik gösterebilir. Ama şunu bilmelisin: Altyapı sorgulama sonucunda sana sunacağımız değerler tutarlılık gösterir. Yani altyapı sorgulama yaptın ve 100 Mbps sonucunu gördün diyelim. Bu durumda, düzenli olarak 100 Mbps’ye oldukça yakın değerleri görebilirsin."
            - separator [ref=e242]
            - generic [ref=e243]:
              - button "Bana Sunacağınızdan Daha Düşük veya Daha Hızlı Bir Paket Seçebiliyor muyum?" [ref=e244] [cursor=pointer]:
                - generic [ref=e246]: Bana Sunacağınızdan Daha Düşük veya Daha Hızlı Bir Paket Seçebiliyor muyum?
                - img [ref=e248]
              - heading [level=3] [ref=e251]:
                - paragraph [ref=e253]: Turknet, kullanıcıların en verimli deneyimi yaşaması için hız/fiyat dengesini gözetir ve bu kapsamda onlara en hızlı seçeneği mümkün olan en iyi fiyatla sunar. Bu nedenle, kullanıcıların altyapı özelinde alabilecekleri daha düşük veya daha hızlı bir paketimiz bulunmaz. Fakat, altyapın VDSL’den fibere güncellendi diyelim. Böyle bir durumda hiçbir ücret talep etmeden, sana ekstra bir maliyet çıkartmadan hızını yükseltebiliriz. Turknet olarak her zaman senin için en iyisini düşünürüz.
            - separator [ref=e254]
            - generic [ref=e255]:
              - button "Modem Veriyor musunuz?" [ref=e256] [cursor=pointer]:
                - generic [ref=e258]: Modem Veriyor musunuz?
                - img [ref=e260]
              - heading [level=3] [ref=e263]:
                - paragraph [ref=e265]: Altyapın fiber için uygunsa, sana bir modem temin ediyor ve abonelik süren boyunca bu modemi ücretsiz kullanmanı sağlıyoruz. Bunun yanı sıra, modem satışı da gerçekleştiriyoruz ama bu hizmetimizi sadece bazı bölgelere sunuyoruz. Elinde altyapına uyum sağlayacak bir modemin varsa, internet bağlantısı için bu cihazı da kullanabilirsin. Bize 0850 288 80 80 numaralı telefon üzerinden ulaşabilirsen bu konu hakkındaki tüm detayları seninle paylaşmaktan mutluluk duyarız.
            - separator [ref=e266]
            - generic [ref=e267]:
              - button "İlk Faturam Ne Zaman Gelir?" [ref=e268] [cursor=pointer]:
                - generic [ref=e270]: İlk Faturam Ne Zaman Gelir?
                - img [ref=e272]
              - heading [level=3] [ref=e275]:
                - paragraph [ref=e277]: İlk faturan, internet hizmetinin aktivasyonu tamamlandığında ve kullanımın başladığında oluşur. Aktivasyon hangi gün gerçekleşirse, o gün fatura döneminin başlangıç tarihi olur. Örneğin, bağlantın 21 Temmuz’da aktif olduysa ve kullanıma da o gün başladıysan, her ayın 21’inde yeni faturan kesilir.
            - separator [ref=e278]
            - generic [ref=e279]:
              - button "Herhangi Bir Arıza Olursa, Sorunum Ne Zaman Çözülür?" [ref=e280] [cursor=pointer]:
                - generic [ref=e282]: Herhangi Bir Arıza Olursa, Sorunum Ne Zaman Çözülür?
                - img [ref=e284]
              - heading [level=3] [ref=e287]:
                - paragraph [ref=e289]: Teknik ekibimiz genellikle 24 ila 48 saat içinde arızaya müdahale eder ve uzmanlığı sayesinde meydana gelen sorunu olabildiğince hızlı bir şekilde çözüme kavuşturur. Kendi altyapımızda hizmet sağladığımız GigaFiber için bu süre daha da kısadır. Turknet, kullanıcılarının daima kesintisiz hizmet almasını savunur, bu nedenle de meydana gelebilecek her türlü problemi önceliklendirir ve en hızlı şekilde ortadan kaldırır.
            - separator [ref=e290]
            - generic [ref=e291]:
              - button "Başka Bir Yere Taşınırsam, İnternetimi de Oraya Götürebilir miyim?" [ref=e292] [cursor=pointer]:
                - generic [ref=e294]: Başka Bir Yere Taşınırsam, İnternetimi de Oraya Götürebilir miyim?
                - img [ref=e296]
              - heading [level=3] [ref=e299]:
                - paragraph [ref=e301]: Evet. Taşındığın yerde altyapımız varsa, internetini orada kullanmaya devam edebilirsin. Bu ihtimal oldukça düşük ama taşındığında yerde altyapımız yoksa da, taahhüt cayma bedeli gibi ekstra bir ücret ödemek zorunda kalmadan bizden aldığın hizmeti doğrudan sonlandırabilirsin. Çünkü, Turknet’te taahhüt yok.
            - separator [ref=e302]
            - generic [ref=e303]:
              - button "Turknet’te Taahhüt Yok Dediniz Ama Evime Kablo Çekilmesi Taahhüt Sayılmaz mı?" [ref=e304] [cursor=pointer]:
                - generic [ref=e306]: Turknet’te Taahhüt Yok Dediniz Ama Evime Kablo Çekilmesi Taahhüt Sayılmaz mı?
                - img [ref=e308]
              - heading [level=3] [ref=e311]:
                - paragraph [ref=e313]: Hayır, bu bir taahhüt değildir. Turknet’te taahhütsüz hizmet sunulur. Altyapının türüne göre bağlantının sağlanabilmesi için evine bir kablo çekilmesi gerekebilir. Bu işlem, internet hizmetinin teknik olarak çalışması için yapılan standart bir kurulumdur ve seni belirli bir süre hizmet almaya zorlayan yasal bir taahhüt anlamına gelmez. Yani evinize kablo çekilmiş olsa bile, hizmetten memnun kalmazsan istediğin zaman aboneliğini iptal edebilirsin. Bu esneklik, Turknet’in taahhütsüzlük ilkesinin bir parçasıdır.
            - separator [ref=e314]
            - generic [ref=e315]:
              - button "Altyapı Sorgulaması Yapmak Neden Önemli?" [ref=e316] [cursor=pointer]:
                - generic [ref=e318]: Altyapı Sorgulaması Yapmak Neden Önemli?
                - img [ref=e320]
              - heading [level=3] [ref=e323]:
                - paragraph [ref=e325]: Altyapı sorgulaması, evinde erişebileceğin internet hızını ve desteklenen teknolojiyi (örneğin VDSL, ADSL, fiber) öğrenmenin en doğru yoludur. Çünkü internet hizmetinin kalitesi, bulunduğun adresteki altyapı olanaklarına doğrudan bağlıdır. Her bölgenin altyapısı ise farklılık gösterebilir. Bu nedenle internete hangi hızla ve altyapı seçeneğiyle bağlanabileceğinin yolu, altyapı sorgulama işlemi gerçekleştirmekten geçer.
